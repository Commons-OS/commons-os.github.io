title: Commons Engineering
description: The discipline for building living, adaptive systems in the Cognitive Age.
url: "https://commons-os.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude from build
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "deck"
    values:
      layout: null
